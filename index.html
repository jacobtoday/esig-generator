<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Signature Studio</title>
<style>
:root{--ink:#14161a;--mut:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;--card:#fff;--acc:#e4572e;--acc-d:#c9431f;--ok:#16a34a;--bad:#dc2626;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--acc)}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .brand{font-weight:700;letter-spacing:-.01em}
.top .brand i{display:inline-block;width:10px;height:10px;background:var(--acc);border-radius:3px;margin-right:8px}
.top .sp{flex:1}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#c5c8ce}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #f6c1b1;border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
.fld{margin:0 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mut)}
.small{font-size:12px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0f3;color:var(--mut)}
.pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:#fafafa}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:360px}
.login h1{font-size:20px;margin-bottom:4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.split{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:20px;align-items:start}
.sticky{position:sticky;top:70px}
.ctl{max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
details.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"+";float:right;color:var(--mut)}
details.sec[open]>summary:after{content:"–"}
details.sec>.body{padding:2px 14px 6px}
.inl{display:flex;align-items:center;gap:8px}
.inl input[type=range]{flex:1}
.inl .val{min-width:42px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;cursor:pointer}
.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.layouts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer;text-align:center;font-size:12px;font-weight:600}
.layouts button.on{border-color:var(--acc);box-shadow:0 0 0 2px #f6c1b1}
.layouts .mini{height:34px;margin-bottom:4px;display:flex;gap:4px;align-items:center;justify-content:center}
.layouts .mini b{display:block;background:#d1d5db;border-radius:2px}
.frow{display:grid;grid-template-columns:22px 1fr 44px 52px;gap:6px;align-items:center;margin-bottom:6px}
.frow input[type=text]{padding:5px 8px}
.stage{border:1px solid var(--line);border-radius:var(--r);padding:24px;overflow:auto}
.stage.w{background:#fff}.stage.g{background:#e9ebef}.stage.d{background:#1b1d22}
.stage .inner{margin:0 auto}.stage.m .inner{max-width:360px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--ink);color:#fff}
.ws{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
.plist{margin:0 0 12px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.plist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;cursor:pointer}
.plist button:last-child{border-bottom:0}
.plist button.on{background:#fff4f0;font-weight:700}
.photo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.photo .av{width:64px;height:64px;border-radius:50%;background:#e5e7eb center/cover;flex:none}
.status{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.modal h2{font-size:17px;margin-bottom:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.cred{background:#f3f4f6;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-weight:600;font-size:13px}
.guide details{border-bottom:1px solid var(--line);padding:2px 0}
.guide summary{cursor:pointer;font-weight:600;padding:9px 0}
.guide ol{margin:0 0 10px;padding-left:20px}.guide li{margin:3px 0}
.cropbox{width:280px;height:280px;margin:0 auto 12px;border-radius:8px;overflow:hidden;background:#222;touch-action:none;cursor:grab}
.cropbox canvas{display:block}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;margin:0 0 14px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0;cursor:pointer;overflow:hidden;text-align:center;font-size:12px;font-weight:600}
.pbtn:hover{border-color:var(--acc)}
.pbtn .thumb{height:84px;overflow:hidden;position:relative;background:#fff;pointer-events:none}
.pbtn .thumb>table{transform:scale(.3);transform-origin:0 0;margin:8px 0 0 8px}
.pbtn span{display:block;padding:5px;border-top:1px solid var(--line)}
.quick{margin-bottom:6px}
@media(max-width:900px){.split,.ws{grid-template-columns:1fr}.sticky{position:static}.ctl{max-height:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Utilities
   ===================================================================== */
const $ = (s, r) => (r || document).querySelector(s);

async function api(method, path, body) {

  let b;

  else if (body !== undefined) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
  const r = await fetch(path, { method, headers: h, body: b, credentials: 'same-origin' });
  let j = null; try { j = await r.json(); } catch (e) { }
  if (!r.ok) { const e = new Error((j && j.error) || ('Error ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); return true; }
  catch (e) {
    const ta = el('textarea', { style: 'position:fixed;left:-9999px' }, t); document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } ta.remove(); toast(ok ? 'Copied' : 'Copy failed'); return ok;
  }
}
function download(name, text, type) {
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/html' })), download: name });
  document.body.append(a); a.click(); a.remove();
}
function modal(build) {
  const back = el('div', { class: 'modal' });
  const box = el('div', { class: 'box' });
  back.append(box);
  const close = () => back.remove();
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  build(box, close);
  document.body.append(back);
  return close;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => modal((box, close) => {
    box.append(el('h2', {}, title), el('p', {}, text), el('div', { class: 'acts' },
      el('button', { class: 'btn', onclick: () => { close(); res(false); } }, 'Cancel'),
      el('button', { class: 'btn ' + (danger ? 'dng' : 'pri'), onclick: () => { close(); res(true); } }, okLabel || 'OK')));
  }));
}

/* =====================================================================
   Design model
   ===================================================================== */
const NETS = { linkedin: 'LinkedIn', facebook: 'Facebook', instagram: 'Instagram', x: 'X', youtube: 'YouTube', tiktok: 'TikTok', pinterest: 'Pinterest', whatsapp: 'WhatsApp' };
const FONTS = [
  ['Arial, Helvetica, sans-serif', 'Arial'], ['Verdana, Geneva, sans-serif', 'Verdana'], ['Tahoma, Geneva, sans-serif', 'Tahoma'],
  ["'Trebuchet MS', Helvetica, sans-serif", 'Trebuchet MS'], ["'Helvetica Neue', Helvetica, Arial, sans-serif", 'Helvetica Neue'],
  ["Calibri, Arial, sans-serif", 'Calibri'], ["'Segoe UI', Arial, sans-serif", 'Segoe UI'],
  ['Georgia, Times, serif', 'Georgia'], ["'Times New Roman', Times, serif", 'Times New Roman'], ["'Courier New', Courier, monospace", 'Courier New']
];
const FIELD_DEFS = [
  { key: 'name', label: 'Full name', group: 'id', on: true, fixed: true },
  { key: 'title', label: 'Job title', group: 'id', on: true },
  { key: 'department', label: 'Department', group: 'id', on: false },
  { key: 'company', label: 'Company', group: 'id', on: true },
  { key: 'phone', label: 'Phone', letter: 'T', group: 'contact', on: true },
  { key: 'mobile', label: 'Mobile', letter: 'M', group: 'contact', on: true },
  { key: 'email', label: 'Email', letter: 'E', group: 'contact', on: true },
  { key: 'website', label: 'Website', letter: 'W', group: 'contact', on: true },
  { key: 'address', label: 'Address', letter: 'A', group: 'contact', on: false },
  { key: 'extra1', label: 'Custom line 1', letter: '', group: 'contact', on: false },
  { key: 'extra2', label: 'Custom line 2', letter: '', group: 'contact', on: false }
];
const DEFAULT_DESIGN = {
  layout: 'classic', imageSlot: 'logo', logoWithPhoto: true, divider: true, dividerWidth: 1, gap: 16,
  font: FONTS[0][0], size: 13, nameSize: 17, underline: false, labels: 'letter', rowGap: 3,
  colors: { accent: '#e4572e', name: '#111111', text: '#444444', link: '#e4572e', label: '#e4572e', divider: '#d9d9d9', muted: '#8a8a8a' },
  logo: { id: '', w: 0, h: 0, width: 130, alt: '' },
  photo: { size: 90, shape: 'round' },
  socials: { style: 'square', size: 26, gap: 5, bg: '', custom: [], items: Object.fromEntries(Object.keys(NETS).map(k => [k, { on: false, url: '', perPerson: false, iconId: '', iw: 0, ih: 0 }])) },
  banner: { on: false, id: '', w: 0, h: 0, width: 420, link: '', alt: '' },
  dark: { on: false, colors: { accent: '#ff7a55', name: '#ffffff', text: '#d6d9de', link: '#ff7a55', label: '#ff7a55', divider: '#4a4f58', muted: '#9aa0aa' }, logo: { id: '', w: 0, h: 0 } },
  closing: '', disclaimer: { on: false, text: '' },
  perm: { add: true, remove: true, photo: true }, portalNote: '',
  fields: FIELD_DEFS.map(f => ({ key: f.key, label: f.label, letter: f.letter || '', on: f.on }))
};
function deepMerge(t, s) {
  if (!s || typeof s !== 'object') return t;
  for (const k in s) {
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], s[k]);
    else t[k] = s[k];
  }
  return t;
}
function mergeDesign(saved) {
  const d = deepMerge(clone(DEFAULT_DESIGN), saved || {});
  const sf = (saved && Array.isArray(saved.fields)) ? saved.fields : [];
  const seen = {}, out = [];
  sf.forEach(f => { const def = FIELD_DEFS.find(x => x.key === f.key); if (def && !seen[f.key]) { seen[f.key] = 1; out.push({ key: f.key, label: f.label || def.label, letter: f.letter == null ? (def.letter || '') : f.letter, on: f.key === 'name' ? true : !!f.on }); } });
  FIELD_DEFS.forEach(def => { if (!seen[def.key]) out.push({ key: def.key, label: def.label, letter: def.letter || '', on: def.on }); });
  d.fields = out;
  return d;
}
const SAMPLE = { name: 'Alex Morgan', title: 'Marketing Director', department: 'Brand & Growth', company: 'Example Co', phone: '+61 8 8123 4567', mobile: '0400 123 456', email: 'alex.morgan@example.com', website: 'www.example.com', address: 'Level 2, 123 Example St, Adelaide SA 5000', extra1: 'Mon – Thu', extra2: '' };
const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#d7dae0"/><circle cx="60" cy="46" r="20" fill="#fff"/><path d="M20 120c4-28 22-40 40-40s36 12 40 40z" fill="#fff"/></svg>');

/* ---------- colour helpers ---------- */
const hex2rgb = h => { h = String(h).replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0); };
const rgb2hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const lum = h => { const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v + (B[i] - v) * t)); };

// Mid-tone colour that keeps >=3.5:1 contrast on both white and the dark background (works with rich paste, Gmail, etc.)
function darkSafe(hex) { let c = hex, n = 0; while (lum(c) < .17 && n++ < 40) c = mixHex(c, '#ffffff', .06); n = 0; while (lum(c) > .25 && n++ < 40) c = mixHex(c, '#000000', .06); return c; }

  return { name: '#ffffff', text: '#d6d9de', muted: '#9aa0aa', divider: '#4a4f58', accent: ensureContrast(c.accent, DARK_BG, 4.5), link: ensureContrast(c.link, DARK_BG, 4.5), label: ensureContrast(c.label, DARK_BG, 4.5) };

/* =====================================================================
   Email-safe signature renderer

  const K = (...roles) => mq ? ` class="${roles.map(r => 'sig-' + r).join(' ')}"` : '';
  const S = Math.max(9, +d.size || 13), LH = Math.round(S * 1.5), NS = Math.max(S, +d.nameSize || 17);
  const base = `font-family:${d.font};font-size:${S}px;line-height:${LH}px;mso-line-height-rule:exactly;color:${col('text')};`;
  const T = (inner, style) => `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;${style || ''}">${inner}</table>`;
  const R = (inner, style, roles) => `<tr><td${K(...(roles || ['t']))} style="${base}${style || ''}">${inner}</td></tr>\n`;
  const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; return /^https?:\/\//i.test(u) ? u : ''; };
  const ul = d.underline ? 'underline' : 'none';
  const A = (href, text, extra) => `<a href="${esc(href)}" target="_blank"${K('l')} style="color:${col('link')};text-decoration:${ul};${extra || ''}"><span${K('l')} style="color:${col('link')};text-decoration:${ul};">${esc(text)}</span></a>`;
  const IMG = (src, w, h, alt, extra) => `<img src="${esc(src)}" width="${w}"${h ? ` height="${h}"` : ''} alt="${esc(alt || '')}" border="0" style="display:block;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;width:${w}px;${h ? `height:${h}px;` : 'height:auto;'}${extra || ''}">`;
  const src = id => origin + '/i/' + id;
  const ratio = (im, w) => im && im.w ? Math.round(w * im.h / im.w) : 0;
  const fieldCfg = {}; (d.fields || []).forEach(f => fieldCfg[f.key] = f);
  const on = k => fieldCfg[k] ? !!fieldCfg[k].on : false;
  const val = k => {
    if (!on(k)) return '';
    let v = String(p[k] || '').trim();
    if (!v && o.sample && SAMPLE[k]) v = SAMPLE[k];
    return v;
  };

  // ---- images (logo can swap to a dark-background version)
  const logoOK = !!(d.logo && d.logo.id);
  const lw = logoOK ? Math.max(20, +d.logo.width || 120) : 0;
  const darkLogo = !!(dk && dk.logo && dk.logo.id);
  const logoSmall = (w) => {
    const alt = d.logo.alt || o.clientName || '';
    const light = IMG(src(d.logo.id), w, ratio(d.logo, w), alt);
    if (!darkLogo) return light;
    const dark = IMG(src(dk.logo.id), w, ratio(dk.logo, w), alt);
    if (forceDark) return dark;
    return light.replace('<img ', '<img class="sig-lt" ') +
      dark.replace('<img ', '<img class="sig-dk" ').replace('style="display:block;', 'style="display:none;mso-hide:all;max-height:0;overflow:hidden;');
  };
  const logoImg = () => logoSmall(lw);
  let leftHtml = '', usedLogoLeft = false;
  const psz = Math.max(40, +(d.photo && d.photo.size) || 90);
  if (d.imageSlot === 'photo') {
    const pid = d.photo.shape === 'round' ? (p.photoRound || p.photo) : (p.photo || p.photoRound);
    if (pid) leftHtml = IMG(src(pid), psz, psz, p.name || '');
    else if (o.placeholder) leftHtml = IMG(PLACEHOLDER, psz, psz, '', d.photo.shape === 'round' ? 'border-radius:50%;' : '');

/* ---------- clipboard: copy rendered signature as rich HTML ---------- */
async function copySignatureRich(html) {
  const buf = el('div', { style: 'position:fixed;left:-10000px;top:0;background:#fff;color:#000;width:700px' });
  buf.innerHTML = html; document.body.append(buf);
  let ok = false;
  try {
    const sel = getSelection(), r = document.createRange(); r.selectNodeContents(buf); sel.removeAllRanges(); sel.addRange(r);
    ok = document.execCommand('copy'); sel.removeAllRanges();
  } catch (e) { ok = false; }
  buf.remove();
  if (!ok && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([html.replace(/<[^>]+>/g, ' ')], { type: 'text/plain' }) })]);
      ok = true;
    } catch (e) { ok = false; }
  }
  toast(ok ? 'Signature copied — now paste it into your email settings' : 'Copy failed — use "Copy HTML" instead');
  return ok;
}

/* =====================================================================
   Image helpers: logo/banner resize, headshot cropper
   ===================================================================== */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that image')); i.src = src; }); }
async function prepDesignImage(file, maxW) {
  if (!/^image\/(png|jpeg|gif)$/.test(file.type)) throw new Error('Use a PNG, JPG or GIF (SVG is not supported by email clients)');
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    if (img.naturalWidth <= maxW && file.size < 2.5 * 1024 * 1024) return { blob: file, w: img.naturalWidth, h: img.naturalHeight };
    const sc = Math.min(1, maxW / img.naturalWidth), w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
    const c = el('canvas', { width: w, height: h }); c.getContext('2d').drawImage(img, 0, 0, w, h);
    const type = file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png';
    const blob = await new Promise(r => c.toBlob(r, type, .9));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}
function openCropper(file) {
  return new Promise(async (resolve) => {
    let img;
    try { img = await loadImg(URL.createObjectURL(file)); } catch (e) { toast('Could not read that image'); return resolve(null); }
    const BOX = 280, OUT = 240;
    let zoom = 1, ox = 0, oy = 0;
    const min = Math.max(BOX / img.naturalWidth, BOX / img.naturalHeight);
    const cv = el('canvas', { width: BOX, height: BOX });
    const clampPos = () => { const sc = min * zoom, mx = Math.max(0, (img.naturalWidth * sc - BOX) / 2), my = Math.max(0, (img.naturalHeight * sc - BOX) / 2); ox = Math.max(-mx, Math.min(mx, ox)); oy = Math.max(-my, Math.min(my, oy)); };
    const draw = (c, size, round) => {
      const k = size / BOX, ctx = c.getContext('2d'), sc = min * zoom * k;
      ctx.clearRect(0, 0, size, size);
      if (!round) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size); }
      ctx.save();
      if (round) { ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); ctx.closePath(); ctx.clip(); }
      ctx.drawImage(img, size / 2 + ox * k - img.naturalWidth * sc / 2, size / 2 + oy * k - img.naturalHeight * sc / 2, img.naturalWidth * sc, img.naturalHeight * sc);
      ctx.restore();
    };
    const paint = () => { clampPos(); draw(cv, BOX, false); const g = cv.getContext('2d'); g.save(); g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.rect(0, 0, BOX, BOX); g.arc(BOX / 2, BOX / 2, BOX / 2 - 2, 0, Math.PI * 2, true); g.fill('evenodd'); g.restore(); };
    let drag = null;
    cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!drag) return; ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y; paint(); };
    cv.onpointerup = () => { drag = null; };
    modal((box, close) => {
      let done = false;
      const finish = v => { if (done) return; done = true; close(); resolve(v); };
      box.append(el('h2', {}, 'Position your photo'), el('div', { class: 'cropbox' }, cv),
        el('label', { class: 'lbl' }, 'Zoom'), el('input', { type: 'range', min: 1, max: 3, step: .01, value: 1, style: 'width:100%', oninput: e => { zoom = +e.target.value; paint(); } }),
        el('p', { class: 'muted small' }, 'Drag to reposition. The photo is cropped to a square (and a circle where the design uses round photos).'),
        el('div', { class: 'acts' }, el('button', { class: 'btn', onclick: () => finish(null) }, 'Cancel'),
          el('button', { class: 'btn pri', onclick: async () => {
            const a = el('canvas', { width: OUT, height: OUT }), b = el('canvas', { width: OUT, height: OUT });
            draw(a, OUT, false); draw(b, OUT, true);
            const square = await new Promise(r => a.toBlob(r, 'image/jpeg', .9)), round = await new Promise(r => b.toBlob(r, 'image/png'));
            finish({ square, round });
          } }, 'Use photo')));
      paint();
      const mo = new MutationObserver(() => { if (!document.body.contains(box)) { mo.disconnect(); finish(null); } }); mo.observe(document.body, { childList: true, subtree: true });
    });
  });
}

function buildWorkspace(ctx) {
  // ctx: {base, getDesign(), people[], perm{add,remove,photo}, clientName, guide:boolean}
  const root = el('div', { class: 'ws' });

  let stage = 'w', mobile = false;
  const left = el('div'), right = el('div');

  const status = el('span', { class: 'status' }, '');
  const preview = el('div', { class: 'inner' });
  const stageEl = el('div', { class: 'stage w' }, preview);
  const cur = () => ctx.people.find(p => p.id === selId);
  const sigHtml = () => { const p = cur(); return renderSignature(ctx.getDesign(), p ? p.data : {}, { origin: location.origin, clientName: ctx.clientName, placeholder: false }); };
  const refreshPreview = () => {
    const p = cur();
    preview.innerHTML = p ? renderSignature(ctx.getDesign(), p.data, { origin: location.origin, clientName: ctx.clientName, placeholder: true, forceDark: stage === 'd' }) : '<span class="muted">Add a person to see their signature.</span>';
    stageEl.className = 'stage ' + stage + (mobile ? ' m' : '');
  };
  ctx.refresh = refreshPreview;

  const saveNow = async (p) => {
    status.textContent = 'Saving…';
    try {
      const sent = JSON.stringify(p.data);
      await api('PUT', `${ctx.base}/people/${p.id}`, { data: p.data });
      // never overwrite local data with the response: the user may have typed more while this request was in flight
      status.textContent = JSON.stringify(p.data) === sent ? 'All changes saved' : 'Unsaved changes…';
    } catch (e) {
      status.textContent = e.status === 401 ? 'Session expired — reload the page' : 'Save failed: ' + e.message;
    }
  };
  const saveSoon = debounce(saveNow, 600);

  function renderLeft() {
    left.innerHTML = '';
    const card = el('div', { class: 'card' });
    const head = el('div', { class: 'inl', style: 'margin-bottom:10px' }, el('h3', { style: 'flex:1' }, 'People'),
      ctx.perm.add ? el('button', { class: 'btn sm pri', onclick: addPerson }, '+ Add person') : null);
    card.append(head);
    if (ctx.people.length > 1 || ctx.people.length === 1) {
      const list = el('div', { class: 'plist' });
      ctx.people.forEach(p => list.append(el('button', { class: p.id === selId ? 'on' : '', onclick: () => { saveSoon.flush(cur()); selId = p.id; renderLeft(); refreshPreview(); } }, (p.data.name || '(unnamed)'), p.data.title ? el('span', { class: 'muted small' }, '  ·  ' + p.data.title) : null)));
      card.append(list);

    const p = cur();
    if (p) card.append(buildForm(p));
    left.append(card);
  }

  function buildForm(p) {
    const d = ctx.getDesign();
    const f = el('div');
    const inputFor = (key, label, type, area) => {
      const i = area ? el('textarea', { rows: 2 }) : el('input', { type: type || 'text' });
      i.value = p.data[key] || '';
      i.oninput = () => { p.data[key] = i.value; status.textContent = 'Unsaved changes…'; refreshPreview(); if (key === 'name') { const b = $('.plist .on'); if (b) b.firstChild.textContent = i.value || '(unnamed)'; } saveSoon(p); };
      i.onblur = () => saveSoon.flush(p);

    };
    if (d.imageSlot === 'photo') {
      const av = el('div', { class: 'av', style: p.data.photoRound || p.data.photo ? `background-image:url(/i/${p.data.photoRound || p.data.photo})` : '' });
      const fi = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif', class: 'hide', onchange: async e => {
        const file = e.target.files[0]; e.target.value = ''; if (!file) return;
        const res = await openCropper(file); if (!res) return;
        try {
          status.textContent = 'Uploading photo…';
          let row = await api('POST', `${ctx.base}/people/${p.id}/photo?variant=square`, res.square);
          row = await api('POST', `${ctx.base}/people/${p.id}/photo?variant=round`, res.round);
          p.data = row.data; status.textContent = 'Photo saved'; renderLeft(); refreshPreview();
        } catch (er) { status.textContent = 'Upload failed: ' + er.message; }
      } });
      f.append(el('div', { class: 'photo' }, av, el('div', {},

async function portalMain(slug) {
  let meta;
  try { meta = await api('GET', `/api/c/${slug}/meta`); }
  catch (e) { app.append(el('div', { class: 'center' }, el('div', { class: 'card login' }, el('h1', {}, 'Page not found'), el('p', { class: 'muted' }, 'Check the link you were sent.')))); return; }
  document.title = meta.name + ' — Email signatures';
  if (!meta.authed) return portalLogin(slug, meta.name);
  portalApp(slug);
}
function portalLogin(slug, name) {
  app.innerHTML = '';
  const pw = el('input', { type: 'password', placeholder: 'Password', autofocus: true });
  const err = el('div', { class: 'err' });
  const go = async () => { try { await api('POST', `/api/c/${slug}/login`, { password: pw.value }); portalApp(slug); } catch (e) { err.textContent = e.message; } };
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
  app.append(el('div', { class: 'center' }, el('div', { class: 'card login' }, el('h1', {}, name), el('p', { class: 'muted' }, 'Sign in to update your email signature details.'), el('div', { class: 'fld' }, pw), el('button', { class: 'btn pri', style: 'width:100%', onclick: go }, 'Continue'), err)));
}
async function portalApp(slug) {
  app.innerHTML = '';
  let data;
  try { data = await api('GET', `/api/c/${slug}/data`); } catch (e) { return portalMain(slug); }
  const design = mergeDesign(data.client.design);
  const out = el('button', { class: 'btn sm', onclick: async () => { await api('POST', `/api/c/${slug}/logout`); portalLogin(slug, data.client.name); } }, 'Sign out');
  const ctx = { base: `/api/c/${slug}`, getDesign: () => design, people: data.people, perm: { add: design.perm.add !== false, remove: design.perm.remove !== false, photo: design.perm.photo !== false }, clientName: data.client.name, guide: true };
  app.append(el('div', { class: 'top' }, el('div', { class: 'brand' }, el('i'), data.client.name), el('div', { class: 'sp' }), out),
    el('div', { class: 'wrap' },
      el('h2', { style: 'margin-bottom:4px' }, 'Your email signature'),
      el('p', { class: 'muted', style: 'margin:0 0 16px' }, 'Update your details on the left — changes save automatically. When it looks right, copy it and follow the install steps for your email app.'),
      design.portalNote && design.portalNote.trim() ? el('div', { class: 'note' }, design.portalNote) : null,
      buildWorkspace(ctx)));
}

/* =====================================================================
   Router
   ===================================================================== */
(function route() {
  const p = location.pathname;
  if (p.startsWith('/c/')) return portalMain(decodeURIComponent(p.split('/')[2] || ''));
  if (p.startsWith('/admin')) return adminMain();
  location.replace('/admin');
})();
</script>
